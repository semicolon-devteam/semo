<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>실버 반지 : 시장가 조사 fixture (정적)</title>
</head>
<body>
  <h1>실버 반지 검색 결과 (정적 fixture)</h1>
  <!-- 네이버쇼핑 카드 구조를 모사한 정적 fixture.
       네이버 봇 차단 시 "퍼시스턴트세션+스크랩+집계" 메커니즘 실증용. -->
  <ul id="product-list">
    <li class="product-item">
      <a class="product-title">925 실버 데일리 반지 심플 은반지</a>
      <span class="product-price">12,800원</span>
    </li>
    <li class="product-item">
      <a class="product-title">실버925 커플링 남녀 세트 반지</a>
      <span class="product-price">28,000원</span>
    </li>
    <li class="product-item">
      <a class="product-title">은 반지 여성 가는 레이어드 링</a>
      <span class="product-price">9,900원</span>
    </li>
    <li class="product-item">
      <a class="product-title">실버 큐빅 반지 화려한 웨딩 스타일</a>
      <span class="product-price">45,500원</span>
    </li>
    <li class="product-item">
      <a class="product-title">순은 실버바 반지 두꺼운 시그넷</a>
      <span class="product-price">33,200원</span>
    </li>
    <li class="product-item">
      <a class="product-title">실버 오픈링 프리사이즈 데일리</a>
      <span class="product-price">7,500원</span>
    </li>
    <li class="product-item">
      <a class="product-title">925 실버 탄생석 반지 맞춤 제작</a>
      <span class="product-price">52,000원</span>
    </li>
    <li class="product-item">
      <a class="product-title">실버 트위스트 꼬임 반지 유니크</a>
      <span class="product-price">15,900원</span>
    </li>
  </ul>
</body>
</html>
