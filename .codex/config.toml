[mcp_servers.context7]
args = [
    "-y",
    "@upstash/context7-mcp",
]
command = "npx"

[mcp_servers.github]
args = [
    "-y",
    "@modelcontextprotocol/server-github",
]
command = "npx"

[mcp_servers.semo-call-stub]
args = [
    "tsx",
    "packages/semo-call/src/stub/index.ts",
]
command = "npx"

[mcp_servers.semo-call-stub.env]
SEMO_SERVICE_ID = "semo-dev"
VOICE_API_URL = "http://localhost:8922"

[mcp_servers.sequential-thinking]
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]
command = "npx"
