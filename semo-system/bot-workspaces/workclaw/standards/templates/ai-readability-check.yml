name: AI Readability Check

on:
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: ESLint check
        id: eslint
        run: |
          echo "::group::ESLint AI Readability Rules"
          npm run lint -- --format=json > eslint-report.json || true
          echo "::endgroup::"
        continue-on-error: true
      
      - name: TypeScript check
        id: typecheck
        run: |
          echo "::group::TypeScript Type Check"
          npm run type-check
          echo "::endgroup::"
        continue-on-error: true
      
      - name: Analyze violations
        id: analyze
        run: |
          node scripts/analyze-violations.js > violations-report.txt || true
        continue-on-error: true
      
      - name: Comment PR with violations
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            // ESLint 리포트 읽기
            let report = [];
            try {
              report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
            } catch (e) {
              console.log('No eslint report found');
            }
            
            // 위반 사항 집계
            const violations = report
              .filter(file => file.errorCount > 0)
              .map(file => ({
                file: file.filePath.replace(process.cwd(), ''),
                errors: file.messages.filter(m => 
                  ['max-lines', 'complexity', 'no-warning-comments', 'max-params', 'max-depth'].includes(m.ruleId)
                )
              }))
              .filter(v => v.errors.length > 0);
            
            if (violations.length > 0) {
              let comment = `## ❌ AI Readability 위반\n\n`;
              comment += `**총 ${violations.length}개 파일에서 위반 발견**\n\n`;
              
              violations.forEach(v => {
                comment += `### 📄 ${v.file}\n\n`;
                v.errors.forEach(e => {
                  const emoji = {
                    'max-lines': '📏',
                    'complexity': '🔀',
                    'no-warning-comments': '💬',
                    'max-params': '🔢',
                    'max-depth': '📐'
                  }[e.ruleId] || '⚠️';
                  
                  comment += `${emoji} **Line ${e.line}**: ${e.message}\n`;
                });
                comment += `\n`;
              });
              
              comment += `\n---\n\n`;
              comment += `**수정 방법**: [\`standards/AI-READABILITY.md\`](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/standards/AI-READABILITY.md) 참고\n`;
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
              core.setFailed('AI Readability 규칙 위반이 발견되었습니다.');
            }
      
      - name: Fail workflow if violations found
        if: steps.eslint.outcome == 'failure' || steps.typecheck.outcome == 'failure'
        run: |
          echo "::error::AI Readability 검증 실패"
          exit 1
