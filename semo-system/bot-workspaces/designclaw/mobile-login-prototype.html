<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 로그인 - shadcn/ui 스타일</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        border: "hsl(214.3 31.8% 91.4%)",
                        input: "hsl(214.3 31.8% 91.4%)",
                        ring: "hsl(221.2 83.2% 53.3%)",
                        background: "hsl(0 0% 100%)",
                        foreground: "hsl(222.2 84% 4.9%)",
                        primary: {
                            DEFAULT: "hsl(221.2 83.2% 53.3%)",
                            foreground: "hsl(210 40% 98%)",
                        },
                        secondary: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(222.2 47.4% 11.2%)",
                        },
                        muted: {
                            DEFAULT: "hsl(210 40% 96.1%)",
                            foreground: "hsl(215.4 16.3% 46.9%)",
                        },
                    },
                    borderRadius: {
                        lg: "0.5rem",
                        md: "calc(0.5rem - 2px)",
                        sm: "calc(0.5rem - 4px)",
                    },
                }
            }
        }
    </script>
    <style>
        /* 마이크로 인터랙션 */
        .btn-primary {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover {
            transform: scale(1.02);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .input-field:focus {
            outline: none;
            border-color: hsl(221.2 83.2% 53.3%);
            box-shadow: 0 0 0 3px hsla(221.2, 83.2%, 53.3%, 0.1);
        }
        /* 접근성: 포커스 표시 */
        a:focus, button:focus {
            outline: 2px solid hsl(221.2 83.2% 53.3%);
            outline-offset: 2px;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-4">
    <!-- 모바일 퍼스트: 320px부터 작동 -->
    <div class="w-full max-w-sm">
        <!-- 로고/타이틀 영역 (64px spacing below) -->
        <div class="text-center mb-16">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary mb-6">
                <svg class="w-8 h-8 text-primary-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-foreground mb-2">로그인</h1>
            <p class="text-muted-foreground text-sm">계정에 로그인하여 시작하세요</p>
        </div>

        <!-- 로그인 카드 (shadcn/ui Card 스타일) -->
        <div class="rounded-lg border border-border bg-white shadow-sm p-8">
            <form class="space-y-6">
                <!-- 이메일 입력 (24px spacing) -->
                <div class="space-y-2">
                    <label for="email" class="text-sm font-medium text-foreground">
                        이메일
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="input-field w-full px-3 py-2 text-base border border-input rounded-md bg-background transition-colors"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                        aria-required="true"
                    >
                </div>

                <!-- 비밀번호 입력 -->
                <div class="space-y-2">
                    <label for="password" class="text-sm font-medium text-foreground">
                        비밀번호
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        class="input-field w-full px-3 py-2 text-base border border-input rounded-md bg-background transition-colors"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                        aria-required="true"
                    >
                </div>

                <!-- 비밀번호 찾기 링크 -->
                <div class="text-right">
                    <a href="#" class="text-sm text-primary hover:underline focus:outline-none">
                        비밀번호를 잊으셨나요?
                    </a>
                </div>

                <!-- 로그인 버튼 (32px spacing above) -->
                <button 
                    type="submit" 
                    class="btn-primary w-full py-2.5 px-4 bg-primary text-primary-foreground rounded-md font-medium shadow-sm"
                    aria-label="로그인"
                >
                    로그인
                </button>
            </form>
        </div>

        <!-- 회원가입 링크 (32px spacing above) -->
        <div class="mt-8 text-center">
            <p class="text-sm text-muted-foreground">
                계정이 없으신가요?
                <a href="#" class="text-primary font-medium hover:underline focus:outline-none ml-1">
                    회원가입
                </a>
            </p>
        </div>

        <!-- 접근성 안내 (스크린리더용, 시각적으로 숨김) -->
        <div class="sr-only" aria-live="polite" role="status">
            로그인 폼입니다. 이메일과 비밀번호를 입력하세요.
        </div>
    </div>
</body>
</html>
