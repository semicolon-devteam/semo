name: "✨ Feature Request"
description: "기능 요청 (PlanClaw 기획 후 생성)"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 기능 요청
        PlanClaw이 기획 완료 후 생성하는 이슈 템플릿입니다.

  - type: textarea
    id: summary
    attributes:
      label: "요약"
      description: "기능에 대한 간략한 설명"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "배경 / 목적"
      description: "왜 이 기능이 필요한지, 어떤 문제를 해결하는지"
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: "기능 스펙"
      description: "구현해야 할 상세 요구사항"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Acceptance Criteria"
      description: |
        ReviewClaw가 하나씩 체크하는 검증 항목. 각 AC는 독립적이고 기계적으로 확인 가능해야 함.
        형식: ## AC-N: [기능/시나리오명] 아래에 체크리스트
      value: |
        ## AC-1: [정상 동작]
        - [ ]
        - [ ] 기존 테스트 통과
        - [ ] 타입 에러 0
        - [ ] lint 통과

        ## AC-2: [엣지케이스]
        - [ ]

        ## AC-3: [에러 처리]
        - [ ]
      placeholder: "각 AC는 독립적으로 검증 가능한 조건이어야 합니다"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: "참고사항"
      description: "관련 문서, 디자인, 레퍼런스 등"
    validations:
      required: false
