name: '✨ Feature Request'
description: '기능 요청 / 개선 제안'
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        ## 기능 요청 / 개선 제안
        OSS 베타 사용자도 자유롭게 사용해주세요. AC 섹션은 비워두셔도 됩니다.

  - type: textarea
    id: summary
    attributes:
      label: '요약'
      description: '기능에 대한 간략한 설명'
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: '배경 / 목적 (사용자 스토리)'
      description: '왜 이 기능이 필요한지, 어떤 상황에서 막혔는지'
      placeholder: '예: personal-discord 프로파일에서 ~를 하려고 했는데 ~가 막혀서…'
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: '원하는 동작'
      description: '어떻게 동작했으면 하는지 (구체적이어도 좋고 추상적이어도 좋습니다)'
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: '✅ Acceptance Criteria (내부 팀용)'
      description: |
        세미콜론 팀이 기획 후 채우는 검증 항목. 외부 베타 사용자는 비워두셔도 됩니다.
        형식: ## AC-N: [기능/시나리오명] 아래에 체크리스트
      value: |
        ## AC-1: [정상 동작]
        - [ ]
        - [ ] 기존 테스트 통과
        - [ ] 타입 에러 0
        - [ ] lint 통과

        ## AC-2: [엣지케이스]
        - [ ]

        ## AC-3: [에러 처리]
        - [ ]
      placeholder: '각 AC는 독립적으로 검증 가능한 조건이어야 합니다'
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: '참고사항'
      description: '관련 문서, 디자인, 레퍼런스 등'
    validations:
      required: false
