name: "🐛 Bug Report"
description: "버그 리포트"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 버그 리포트

  - type: textarea
    id: description
    attributes:
      label: "버그 설명"
      description: "어떤 문제가 발생하는지"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "재현 방법"
      description: "버그를 재현하는 단계"
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "기대 동작"
      description: "정상적으로 동작했을 때 예상되는 결과"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "실제 동작"
      description: "현재 실제로 발생하는 결과"
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Acceptance Criteria"
      description: |
        ReviewClaw가 하나씩 체크하는 검증 항목. 각 AC는 독립적이고 기계적으로 확인 가능해야 함.
      value: |
        ## AC-1: 버그 수정 확인
        - [ ] 재현 방법대로 실행 시 버그 미발생
        - [ ] 기존 테스트 통과
        - [ ] 타입 에러 0

        ## AC-2: 회귀 방지
        - [ ] 해당 케이스 커버하는 테스트 추가됨

        ## AC-3: 엣지케이스
        - [ ]
      placeholder: "각 AC는 독립적으로 검증 가능한 조건이어야 합니다"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "환경"
      description: "OS, 브라우저, 앱 버전 등"
    validations:
      required: false
