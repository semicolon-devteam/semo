name: PR Quality Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  quality-check:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Workaround for npm/cli#4828: npm ci skips platform-specific optionalDependencies
      # when the lockfile was generated on a different platform (macOS → linux runner).
      # tailwindcss v4 + @tailwindcss/postcss → lightningcss requires its native binary
      # package (lightningcss-linux-x64-gnu) at runtime; without it the dashboard build
      # fails with "Cannot find module '../lightningcss.linux-x64-gnu.node'".
      # --no-save preserves package.json; we keep the existing lockfile (no --no-package-lock)
      # so the rest of the dependency tree is unchanged, and just add the one missing binary.
      - name: Install platform-specific native binaries
        run: |
          npm install --no-save --ignore-scripts \
            lightningcss-linux-x64-gnu@1.31.1 \
            @tailwindcss/oxide-linux-x64-gnu@4.2.1
          test -f node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node
          test -f node_modules/@tailwindcss/oxide-linux-x64-gnu/tailwindcss-oxide.linux-x64-gnu.node \
            || ls node_modules/@tailwindcss/oxide-linux-x64-gnu/
      - run: npm run lint
      - run: npx tsc --noEmit --project packages/cli/tsconfig.json
      # Dashboard packages throw at build time if NEXT_PUBLIC_SUPABASE_* are missing
      # (lib/supabase/config.ts). Pass placeholder values so the static page-data
      # collection in `next build` doesn't trip the env guard. Real values are
      # supplied in production via DEV_ENV_FILE_CONTENT (dev-ci-cd.yml docker build).
      - name: Build (with placeholder NEXT_PUBLIC_SUPABASE_* for static analysis)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only
        run: npm run build
      - name: CLI bundle smoke (esbuild → single file)
        run: npm run bundle -w @team-semicolon/semo-cli
      - name: Bundle sanity (--version + dry-run init)
        run: |
          node packages/cli/dist/bundle.js --version
          SEMO_HOME=$(mktemp -d) SEMO_CONFIG_PATH=$(mktemp)/config.toml \
            node packages/cli/dist/bundle.js init --profile personal-discord --dry-run
      - name: CLI solo bundle purity
        run: scripts/check-solo-purity.sh
