name: PR Quality Gate

on:
  pull_request:
    branches: [dev, main]

jobs:
  quality-check:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --project packages/cli/tsconfig.json
      - run: npm run build
