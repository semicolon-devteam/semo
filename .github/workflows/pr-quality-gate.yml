name: PR Quality Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  quality-check:
    name: Lint + Type Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Workaround for npm/cli#4828: npm ci skips platform-specific optionalDependencies
      # when lockfile was generated on a different platform (macOS → linux runner).
      # tailwindcss v4 + @tailwindcss/postcss → lightningcss requires the matching
      # native binary package (lightningcss-linux-x64-gnu). Without it the dashboard
      # build fails with "Cannot find module '../lightningcss.linux-x64-gnu.node'".
      - name: Ensure platform-specific native binaries
        run: npm install --no-save --include=optional --ignore-scripts
      - run: npm run lint
      - run: npx tsc --noEmit --project packages/cli/tsconfig.json
      - run: npm run build
      - name: CLI bundle smoke (esbuild → single file)
        run: npm run bundle -w @team-semicolon/semo-cli
      - name: Bundle sanity (--version + dry-run init)
        run: |
          node packages/cli/dist/bundle.js --version
          SEMO_HOME=$(mktemp -d) SEMO_CONFIG_PATH=$(mktemp)/config.toml \
            node packages/cli/dist/bundle.js init --profile personal-discord --dry-run
