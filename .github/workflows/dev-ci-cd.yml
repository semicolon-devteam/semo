name: 1. 개발 CI / CD

on:
  workflow_dispatch:
  push:
    branches: ["dev"]

permissions:
  id-token: write
  contents: write
  actions: read
  security-events: write

jobs:
  build-and-deploy:
    name: 🔨 [semo] 개발환경 CI[Build & Push]
    permissions:
      contents: write
      id-token: write
    uses: semicolon-devteam/actions-template/.github/workflows/ci-common.yml@main
    with:
      source_repository: semo
      environment: dev
      ref: dev
      dockerfile_name: Dockerfile-next
      context_path: ./source/packages/semo-dashboard
    secrets:
      ACTION_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ENV_FILE_CONTENT: ${{ secrets.DEV_ENV_FILE_CONTENT }}

  kustomize-version-update:
    name: 🔨 [semo] 개발환경 Kustomize Version Update
    permissions:
      contents: write
      id-token: write
    needs: build-and-deploy
    uses: semicolon-devteam/actions-template/.github/workflows/update-kustomize-tag.yml@main
    with:
      ops_repository: semi-colon-ops
      ref: main
      environment: dev
      service_name: semo
      image_name: docker.io/semicolonmanager/semo
      tag_value: ${{ needs.build-and-deploy.outputs.image_tag }}
    secrets:
      ACTION_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}

  notify-slack:
    name: 📢 Slack 알림
    runs-on: ubuntu-latest
    needs: [build-and-deploy, kustomize-version-update]
    if: always()
    steps:
      - name: Determine status
        id: status
        run: |
          if [[ "${{ needs.build-and-deploy.result }}" == "success" && "${{ needs.kustomize-version-update.result }}" == "success" ]]; then
            echo "result=✅ 성공" >> $GITHUB_OUTPUT
            echo "is_failure=false" >> $GITHUB_OUTPUT
          else
            echo "result=❌ 실패" >> $GITHUB_OUTPUT
            echo "is_failure=true" >> $GITHUB_OUTPUT
          fi
          COMMIT_TITLE=$(echo "${{ github.event.head_commit.message }}" | head -1)
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.INFRACLAW_TOKEN }}
          payload: |
            {
              "channel": "C0AKZRPKJU8",
              "text": "🔨 [semo] 개발환경 빌드 ${{ steps.status.outputs.result }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🔨 [semo] 개발환경 빌드 ${{ steps.status.outputs.result }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*환경:*\ndev"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*브랜치:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*커밋:*\n${{ steps.status.outputs.commit_title }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*작성자:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|워크플로우 보기>${{ steps.status.outputs.is_failure == 'true' && '\n\n<@U0AF1RK0E67> 빌드 실패 확인 필요' || '' }}"
                  }
                }
              ]
            }
